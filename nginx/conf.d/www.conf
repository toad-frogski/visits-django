upstream backend {
    server unix:/var/run/python/asgi.sock;
}

server {
    listen 80;

    location / {
        root /var/www/frontend/dist;
        index index.html;
        try_files $uri /index.html;
    }

    location /api {
      include proxy_params;
      proxy_pass http://backend;
    }

    location /api/static {
        alias /var/www/backend/static/;
        access_log off;
        expires 3d;
    }

    location /api/media {
        alias /var/www/backend/media/;
        access_log off;
        expires 3d;
    }

}
